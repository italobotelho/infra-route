<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InfraRoute - Login</title>
  <!-- Tailwind CSS via CDN (para não precisar configurar build) -->
  <script src="[suspicious link removed]"></script>
  <link rel="stylesheet" href="assets/css/login.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <!-- Card Principal de Login -->
  <div class="w-full max-w-[450px] bg-white rounded-2xl shadow-lg p-8 flex flex-col items-center gap-6">
    
    <!-- Cabeçalho -->
    <div class="text-center">
      <h1 class="text-4xl font-bold text-gray-900 font-sans">InfraRoute</h1>
      <p class="text-gray-500 mt-1">Entre na sua conta</p>
    </div>

    <!-- Formulário -->
    <form id="loginForm" class="w-full flex flex-col gap-4">
      
      <!-- Campo E-mail -->
      <div class="w-full h-12 px-4 bg-gray-100 rounded-lg flex items-center">
        <input 
          type="email" 
          id="email" 
          placeholder="Digite seu e-mail" 
          required 
          class="w-full bg-transparent outline-none text-gray-800 placeholder-gray-400"
        />
      </div>

      <!-- Campo Senha -->
      <div class="w-full h-12 px-4 bg-gray-100 rounded-lg flex items-center">
        <input 
          type="password" 
          id="password" 
          placeholder="Digite sua senha" 
          required 
          class="w-full bg-transparent outline-none text-gray-800 placeholder-gray-400"
        />
      </div>

      <!-- Campo CREA -->
      <div class="w-full h-12 px-4 bg-gray-100 rounded-lg flex items-center">
        <input 
          type="text" 
          id="crea" 
          placeholder="CREA (ex: 1234567890/SP)" 
          required 
          class="w-full bg-transparent outline-none text-gray-800 placeholder-gray-400"
        />
      </div>

      <!-- Botão Login -->
      <button 
        type="submit" 
        class="w-full h-12 bg-indigo-700 hover:bg-indigo-800 text-white font-medium rounded-lg transition mt-2">
        Login
      </button>

      <!-- Botão Signup -->
      <button 
        type="button" 
        id="btnSignup"
        class="w-full h-12 border border-indigo-600 text-indigo-600 hover:bg-indigo-50 font-semibold rounded-lg transition">
        Signup Now
      </button>
    </form>

  </div>

  <script src="assets/js/login.js"></script>
</body>
</html>
