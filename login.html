<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Corporativo | InfraRoute</title>
    <meta name="description" content="Autenticação de engenheiros e gestores na plataforma multi-tenant InfraRoute.">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/login.css">
    <script src="assets/js/login.js" defer></script>
</head>
<body class="login-body">

    <main class="login-wrapper">
        
        <header class="login-header">
            <img src="assets/img/logo.jpg" alt="Logotipo InfraRoute" width="64" height="64">
            <h1>InfraRoute</h1>
            <p>Planejamento e Otimização de Redes Ópticas</p>
        </header>

        <section class="auth-box" aria-labelledby="titulo-acesso">
            <h2 id="titulo-acesso">Acesso à Plataforma</h2>

            <form id="form-login" action="index.html" method="get">
                <div class="form-field">
                    <label for="email">E-mail Corporativo:</label>
                    <input type="email" id="email" name="email" placeholder="engenheiro@empresa.com.br" required>
                </div>

                <div class="form-field">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
                </div>

                <button type="submit" class="btn-primary">Entrar no Workspace</button>
            </form>
        </section>

    </main>

</body>
</html>
