<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InfraRoute | Planejamento Geoespacial e Engenharia de Redes Ópticas (OSP/FTTH)</title>
    <meta
      name="description"
      content="Plataforma SaaS multi-tenant para planejamento geoespacial OSP/FTTH, cálculo de Árvore Geradora Mínima (Algoritmo de Prim) e governança de redes ópticas."
    />
    <link rel="icon" type="image/png" href="/infraroute-logo.png" />
    <link rel="apple-touch-icon" href="/infraroute-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("infraroute:ui:theme");
          var stored = raw ? JSON.parse(raw) : null;
          var prefersDark =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var isDark = stored === "dark" || (stored !== "light" && prefersDark);
          document.documentElement.classList.toggle("dark", isDark);
          document.documentElement.dataset.theme = isDark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>
      Você precisa habilitar o JavaScript no navegador para utilizar a plataforma InfraRoute.
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx" defer></script>
  </body>
</html>
